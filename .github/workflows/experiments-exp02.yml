# EXP-02 (final study): runs the harness at L1 (simulated), L2 (real binaries, synthetic projects) and
# R (real binaries, pinned public projects), split into parallel shards, then analyses all shards together.
# Runs only when the semester8-exp02-run branch is pushed (or by manual dispatch). The mode and
# repetitions come from SecureGate_Project/experiments/EXP-02/run_config.json on that branch:
# "dry-run" checks the set-up with few repetitions; "final" refuses to start unless the protocol
# matches FROZEN.sha256. Results are added as a new folder on semester8-exp02-results; nothing is
# overwritten and nothing is force-pushed.
name: experiments-exp02

on:
  push:
    branches: [semester8-exp02-run]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: exp02
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.13"
  SEMGREP_VERSION: "1.180.0"
  PIP_AUDIT_VERSION: "2.10.1"
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
  EXP: SecureGate_Project/experiments/EXP-02
  RESULTS_BRANCH: semester8-exp02-results

jobs:
  run:
    name: ${{ matrix.level }} shard ${{ matrix.shard }}
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - { level: L1, shard: "1/1" }
          - { level: L2, shard: "1/5" }
          - { level: L2, shard: "2/5" }
          - { level: L2, shard: "3/5" }
          - { level: L2, shard: "4/5" }
          - { level: L2, shard: "5/5" }
          - { level: R, shard: "1/5" }
          - { level: R, shard: "2/5" }
          - { level: R, shard: "3/5" }
          - { level: R, shard: "4/5" }
          - { level: R, shard: "5/5" }
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install pinned scanners and test dependencies
        run: |
          set -euo pipefail
          python -m pip install --quiet -r requirements-dev.txt
          python -m venv "$RUNNER_TEMP/scanners"
          "$RUNNER_TEMP/scanners/bin/pip" install --quiet "semgrep==${SEMGREP_VERSION}" "pip-audit==${PIP_AUDIT_VERSION}"
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tgz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin" && tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP/bin" gitleaks
          for t in semgrep pysemgrep pip-audit; do
            if [ -e "$RUNNER_TEMP/scanners/bin/$t" ]; then ln -s "$RUNNER_TEMP/scanners/bin/$t" "$RUNNER_TEMP/bin/$t"; fi
          done
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Unit tests
        run: python -m pytest -q

      - name: Run harness shard
        id: harness
        env:
          LEVEL: ${{ matrix.level }}
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          mode=$(python -c "import json;print(json.load(open('$EXP/run_config.json'))['mode'])")
          reps=$(python -c "import json;print(json.load(open('$EXP/run_config.json'))['reps']['$LEVEL'])")
          name="$LEVEL-$(echo "$SHARD" | cut -d/ -f1)"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          final=""; [ "$mode" = "final" ] && final="--final"
          python "$EXP/harness.py" run --level "$LEVEL" --shard "$SHARD" --reps "$reps" \
            --out "shards/$name" $final 2>&1 | tee "$RUNNER_TEMP/harness-$name.log"

      - name: Probes (L1 shard only) - pip-audit on nested requirements, Python 2 files
        if: matrix.level == 'L1'
        run: |
          set +e
          d="shards/L1-1/probes"; mkdir -p "$d" && cd "$d"
          git init -q flasky && git -C flasky fetch -q --depth 1 https://github.com/miguelgrinberg/flasky 3beedd640b9146b0bd65c8c2ecf402b01798bc33 && git -C flasky checkout -q FETCH_HEAD
          git init -q dflask && git -C dflask fetch -q --depth 1 https://github.com/realpython/discover-flask 00762e9ee9e5713cb61ca8734236d05d6e424da9 && git -C dflask checkout -q FETCH_HEAD
          probe() { name=$1; shift; (cd "$1" && shift && "$@") > "$name.out" 2> "$name.err"; echo "$name exit=$?" | tee -a exit_codes.txt; }
          probe pa_flasky_nodeps flasky pip-audit -r requirements.txt --format json --no-deps --disable-pip
          probe pa_flasky_heroku_nodeps flasky/requirements pip-audit -r heroku.txt --format json --no-deps --disable-pip
          probe pa_flasky_default flasky timeout 600 pip-audit -r requirements.txt --format json
          python - <<'EOF' > py_parse_dflask.txt
          import ast, pathlib
          for p in sorted(pathlib.Path("dflask").rglob("*.py")):
              try:
                  ast.parse(p.read_bytes())
              except SyntaxError as e:
                  print(f"{p}: {e.msg} (line {e.lineno})")
          EOF
          probe sg_dflask dflask semgrep --config "$GITHUB_WORKSPACE/$EXP/probe_rules.yml" --json --metrics=off --disable-version-check .
          python - <<'EOF' > probe_summary.json
          import json, glob
          out = {}
          for f in sorted(glob.glob("*.out")):
              try:
                  d = json.load(open(f))
              except Exception as exc:
                  out[f] = {"json": False, "error": str(exc)[:200]}
                  continue
              if "dependencies" in d:
                  deps = d["dependencies"]
                  out[f] = {"dependencies": len(deps), "skipped": sum(1 for x in deps if x.get("skip_reason")),
                            "vulns": sum(len(x.get("vulns", [])) for x in deps)}
              else:
                  out[f] = {"results": len(d.get("results", [])), "errors": [e.get("type") for e in d.get("errors", [])],
                            "scanned": len(d.get("paths", {}).get("scanned", []))}
          print(json.dumps(out, indent=2))
          EOF
          rm -rf flasky dflask
          cat probe_summary.json exit_codes.txt py_parse_dflask.txt

      - name: Validate manifests and check that no synthetic token is stored
        if: always() && steps.harness.outputs.name != ''
        env:
          SHARD_NAME: ${{ steps.harness.outputs.name }}
        run: |
          set -euo pipefail
          d="shards/$SHARD_NAME"
          mkdir -p "$d" && cp "$RUNNER_TEMP/harness-$SHARD_NAME.log" "$d/harness.log" || true
          python - "$d" <<'EOF' | tee "$d/schema_validation.txt"
          import json, glob, sys, jsonschema
          schema = json.load(open("security_engine/schemas/run_manifest.schema.json"))
          files = glob.glob(f"{sys.argv[1]}/runs/**/run_manifest.json", recursive=True)
          for f in files:
              jsonschema.validate(json.load(open(f)), schema)
          print(f"{len(files)} manifests conform to the run-manifest schema")
          EOF
          if grep -rEl 'ghp_[A-Za-z0-9]{36}|AKIA[A-Z0-9]{16}' "$d"; then echo "unredacted token found"; exit 1; fi
          if [ -d "$d/runs" ]; then tar -czf "$d/runs.tar.gz" -C "$d" runs && rm -rf "$d/runs"; fi

      - name: Upload shard
        if: always() && steps.harness.outputs.name != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: exp02-shard-${{ steps.harness.outputs.name }}
          path: shards/
          retention-days: 90

  collect:
    needs: run
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write   # only to add results to the separate results branch
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Download shards
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: exp02-shard-*
          path: downloaded
          merge-multiple: true

      - name: Analyse all shards together
        run: |
          set -euo pipefail
          mode=$(python -c "import json;print(json.load(open('$EXP/run_config.json'))['mode'])")
          mkdir -p results/shards && { [ -d downloaded ] && cp -r downloaded/. results/shards/ || true; }
          shards=$(find results/shards -name runs.csv -printf '%h\n' | sort)
          python "$EXP/harness.py" protocol --out results/protocol.json > results/protocol.sha256
          if [ -n "$shards" ]; then
            python "$EXP/analysis.py" --title "EXP-02 ($mode), workflow run $GITHUB_RUN_ID" --out results/analysis $shards
          fi
          {
            echo "EXP-02 $mode. Workflow run $GITHUB_RUN_ID, commit $GITHUB_SHA, $(date -u +%FT%TZ)."
            echo "Protocol SHA-256: $(cat results/protocol.sha256)"
            echo "Shards with results: $(echo "$shards" | wc -w) of 11."
            echo "L1 = simulated; L2 = real binaries on synthetic projects; R = real binaries on pinned public projects."
          } > results/README.md
          for f in results/shards/*/errors.txt; do [ -e "$f" ] && { echo "== $f"; cat "$f"; } >> results/README.md; done
          cat results/README.md >> "$GITHUB_STEP_SUMMARY"
          [ -f results/analysis/summary.md ] && cat results/analysis/summary.md >> "$GITHUB_STEP_SUMMARY" || true
          echo "mode=$mode" >> "$GITHUB_ENV"

      - name: Add results to the results branch (new folder, no force push)
        run: |
          set -euo pipefail
          dest="EXP-02/${mode}-run-${GITHUB_RUN_ID}"
          mv results /tmp/results
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin "$RESULTS_BRANCH" >/dev/null; then
            git fetch -q origin "$RESULTS_BRANCH" && git checkout -q -B "$RESULTS_BRANCH" FETCH_HEAD
          else
            git checkout -q --orphan "$RESULTS_BRANCH" && git rm -rfq . && git clean -fdxq
          fi
          test ! -e "$dest" || { echo "$dest already exists"; exit 1; }
          mkdir -p "$dest" && cp -r /tmp/results/. "$dest/"
          git add "$dest"
          git commit -q -m "EXP-02 $mode results, run $GITHUB_RUN_ID [skip ci]"
          git push -q origin "$RESULTS_BRANCH"
