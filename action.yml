# SecureGate as a reusable GitHub Action.
#
# Runs Semgrep (SAST), pip-audit (SCA) and Gitleaks (secrets) at pinned versions, checks that each
# scanner's evidence is valid and complete, and decides PASS, BLOCK or INCOMPLETE under the
# repository's own policy file (securegate.toml). The step's exit code is the decision:
# 0 PASS, 1 BLOCK, 2 INCOMPLETE, 3 invalid policy. The report goes to the job summary and the run
# manifest is kept as an artifact, so every run's evidence stays in the repository's Actions history.
#
#   - uses: actions/checkout@<sha>
#     with: { fetch-depth: 0 }          # full history, so Gitleaks can scan every commit
#   - uses: DuclasMatsinhe/SecureGate@<release tag or commit SHA>
#
# Supported runners: Linux x64 (the pinned Gitleaks binary is verified by SHA-256 for that platform).
name: "SecureGate"
description: "Evidence-aware CI/CD security gate: Semgrep, pip-audit and Gitleaks; never passes on missing or broken scanner evidence."
author: "Duclas Argentina Francisco Matsinhe"
branding:
  icon: "shield"
  color: "green"

inputs:
  policy:
    description: "Policy file. Empty: securegate.toml in the working directory if present, otherwise the built-in defaults (strategy S3, block on INCOMPLETE)."
    required: false
    default: ""
  target:
    description: "Folder to scan, relative to the workspace."
    required: false
    default: "."
  output-dir:
    description: "Folder for the run manifest, report and raw scanner output."
    required: false
    default: "securegate-out"
  install-scanners:
    description: "Install the pinned scanners (true) or use the semgrep, pip-audit and gitleaks already on PATH (false)."
    required: false
    default: "true"
  python-version:
    description: "Python used for the engine and the scanners (3.11 or later)."
    required: false
    default: "3.13"
  upload-evidence:
    description: "Upload the manifest, report and raw scanner output as a workflow artifact."
    required: false
    default: "true"
  artifact-name:
    description: "Name of the evidence artifact (must be unique within a workflow run)."
    required: false
    default: "securegate-evidence"
  fail-job:
    description: "Fail the step when the decision is not PASS (true), or only report it in the outputs (false)."
    required: false
    default: "true"

outputs:
  verdict:
    description: "PASS, BLOCK or INCOMPLETE (empty when the policy is invalid)."
    value: ${{ steps.gate.outputs.verdict }}
  exit-code:
    description: "0 PASS, 1 BLOCK, 2 INCOMPLETE, 3 invalid policy or usage."
    value: ${{ steps.gate.outputs.exit_code }}
  manifest:
    description: "Path of run_manifest.json."
    value: ${{ steps.gate.outputs.manifest }}
  report:
    description: "Path of report.md."
    value: ${{ steps.gate.outputs.report }}

runs:
  using: "composite"
  steps:
    - name: Set up Python for SecureGate
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install pinned scanners
      if: inputs.install-scanners == 'true'
      shell: bash
      env:
        SEMGREP_VERSION: "1.180.0"
        PIP_AUDIT_VERSION: "2.10.1"
        GITLEAKS_VERSION: "8.30.1"
        GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
      run: |
        set -euo pipefail
        if [ "$RUNNER_OS" != "Linux" ] || [ "$RUNNER_ARCH" != "X64" ]; then
          echo "::error title=SecureGate::pinned scanners are provided for Linux x64 runners only; set install-scanners: false and put semgrep, pip-audit and gitleaks on PATH yourself"
          exit 3
        fi
        dir="$RUNNER_TEMP/securegate-tools"
        # Semgrep and pip-audit in their own virtual environment, so they cannot change the project's packages.
        python -m venv "$dir/venv"
        "$dir/venv/bin/pip" install --quiet "semgrep==${SEMGREP_VERSION}" "pip-audit==${PIP_AUDIT_VERSION}"
        # Gitleaks release binary, verified against a recorded SHA-256 before use.
        curl -sSfL -o "$dir/gitleaks.tgz" \
          "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
        echo "${GITLEAKS_SHA256}  $dir/gitleaks.tgz" | sha256sum -c -
        mkdir -p "$dir/bin" && tar -xzf "$dir/gitleaks.tgz" -C "$dir/bin" gitleaks
        for t in semgrep pysemgrep pip-audit; do
          if [ -e "$dir/venv/bin/$t" ]; then ln -sf "$dir/venv/bin/$t" "$dir/bin/$t"; fi
        done
        echo "$dir/bin" >> "$GITHUB_PATH"

    - name: Run SecureGate
      id: gate
      shell: bash
      env:
        SG_POLICY: ${{ inputs.policy }}
        SG_TARGET: ${{ inputs.target }}
        SG_OUT: ${{ inputs.output-dir }}
      run: |
        # GitHub starts this shell with -e; the gate's non-zero exit is a decision, not an error, so turn -e off.
        set +e -uo pipefail
        for t in semgrep pip-audit gitleaks; do
          command -v "$t" >/dev/null || echo "::warning title=SecureGate::$t is not on PATH; the gate will report it as missing evidence"
        done
        args=(--target "$SG_TARGET" --out "$SG_OUT")
        if [ -n "$SG_POLICY" ]; then args+=(--policy "$SG_POLICY"); fi
        PYTHONPATH="$GITHUB_ACTION_PATH${PYTHONPATH:+:$PYTHONPATH}" python -m security_engine.cli "${args[@]}" > "$RUNNER_TEMP/securegate-summary.json"
        code=$?
        cat "$RUNNER_TEMP/securegate-summary.json"
        echo "exit_code=$code" >> "$GITHUB_OUTPUT"
        if [ "$code" -eq 3 ]; then
          echo "::error title=SecureGate::invalid policy or usage (exit 3); no scan was run"
          exit 0
        fi
        python - "$RUNNER_TEMP/securegate-summary.json" <<'EOF'
        import json, os, sys
        from collections import Counter
        s = json.load(open(sys.argv[1]))
        with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
            out.write(f"verdict={s['verdict']}\nmanifest={s['manifest']}\nreport={s['report']}\n")
        counts = Counter(f"{r['scanner']}: {r['code']}" for r in s["reasons"])
        reasons = "; ".join(f"{k} x{n}" if n > 1 else k for k, n in counts.items()) or "none"
        level = "notice" if s["verdict"] == "PASS" else "error"
        print(f"::{level} title=SecureGate {s['verdict']}::exit {s['exit_code']}, strategy {s['strategy']}. "
              f"Reasons: {reasons}")
        EOF

    - name: Keep the evidence
      if: always() && inputs.upload-evidence == 'true' && steps.gate.outputs.exit_code != '' && steps.gate.outputs.exit_code != '3'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ inputs.output-dir }}
        if-no-files-found: warn
        retention-days: 30

    - name: Enforce the decision
      if: always() && steps.gate.outputs.exit_code != ''
      shell: bash
      env:
        GATE_EXIT: ${{ steps.gate.outputs.exit_code }}
        FAIL_JOB: ${{ inputs.fail-job }}
      run: |
        case "$GATE_EXIT" in
          0) echo "SecureGate: PASS"; exit 0;;
          1) msg="BLOCK - blocking findings";;
          2) msg="INCOMPLETE - scanner evidence could not be trusted";;
          *) msg="configuration or usage error";;
        esac
        echo "SecureGate: $msg (exit $GATE_EXIT)"
        if [ "$FAIL_JOB" = "true" ]; then exit "$GATE_EXIT"; fi
